[package]
name = "seki"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UDP 443 router for QUIC that keeps connection migration working"

[dependencies]
seki-cid = { path = "../seki-cid" }
aes = "0.9.3"
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.1"
anyhow = "1.0.104"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "process", "sync", "net", "time", "macros", "signal", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
